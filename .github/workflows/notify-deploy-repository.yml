# Announces a new master to a downstream deploy repository via repository
# dispatch. The target is configured per repository, so nothing here is tied to
# a particular deploy repo:
#
#   vars.DEPLOY_DISPATCH_REPOSITORY    owner/repo to dispatch to (required)
#   vars.DEPLOY_DISPATCH_EVENT_TYPE    event_type to send (default mojito-updated)
#   secrets.DEPLOY_DISPATCH_APP_ID     GitHub App installed on the target repo
#   secrets.DEPLOY_DISPATCH_APP_PRIVATE_KEY
#   secrets.PAGERDUTY_ROUTING_KEY      Events API v2 integration key for the
#                                      service that owns dispatch failures
#                                      (optional; alerting is skipped when unset)
name: Notify deploy repository

on:
  push:
    branches: [master]

# The job's own GITHUB_TOKEN is unused: everything here targets another repo.
permissions: {}

jobs:
  notify:
    name: Dispatch deploy event
    # Repository variables are not inherited by forks, so an unset target also
    # means "this checkout has no downstream to notify" and the job is skipped
    # rather than run without credentials. Note the cost of that: a target left
    # unset is silent, and indistinguishable from this workflow not existing.
    if: vars.DEPLOY_DISPATCH_REPOSITORY != ''
    runs-on: ubuntu-latest
    environment: deploy-dispatch
    timeout-minutes: 5
    steps:
      - name: Resolve dispatch target
        id: target
        env:
          TARGET_REPOSITORY: ${{ vars.DEPLOY_DISPATCH_REPOSITORY }}
          EVENT_TYPE: ${{ vars.DEPLOY_DISPATCH_EVENT_TYPE || 'mojito-updated' }}
        run: |
          set -euo pipefail
          # The value reaches both an action input and a URL path, so reject
          # anything that is not a plain owner/repo pair before it is used. Each
          # side must start alphanumeric and cannot contain '..', so no value
          # that passes here can traverse out of the intended API path.
          name='[A-Za-z0-9][A-Za-z0-9._-]*'
          if [[ ! "$TARGET_REPOSITORY" =~ ^$name/$name$ || "$TARGET_REPOSITORY" == *..* ]]; then
            echo "DEPLOY_DISPATCH_REPOSITORY must be owner/repo, got '$TARGET_REPOSITORY'" >&2
            exit 1
          fi
          # A mismatched event type is the one misconfiguration nothing detects:
          # POST /dispatches returns 204 whether or not a workflow listens for
          # the type, so a typo here is a green run and no build, forever. This
          # only rejects malformed values; the value itself must equal the
          # target's `repository_dispatch: types:` entry, which is not readable
          # from this side. Change it only alongside the receiving workflow.
          if [[ ! "$EVENT_TYPE" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "DEPLOY_DISPATCH_EVENT_TYPE must be a plain token, got '$EVENT_TYPE'" >&2
            exit 1
          fi
          echo "owner=${TARGET_REPOSITORY%/*}" >> "$GITHUB_OUTPUT"
          echo "repository=${TARGET_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
          echo "event_type=$EVENT_TYPE" >> "$GITHUB_OUTPUT"

      - name: Mint app token for the target repository
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.DEPLOY_DISPATCH_APP_ID }}
          private-key: ${{ secrets.DEPLOY_DISPATCH_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.repository }}
          # POST /dispatches needs contents: write. There is no narrower
          # dispatch-specific permission, so this is the floor, not a choice.
          permission-contents: write

      - name: Dispatch to the target repository
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_REPOSITORY: ${{ steps.target.outputs.owner }}/${{ steps.target.outputs.repository }}
          EVENT_TYPE: ${{ steps.target.outputs.event_type }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # jq builds the payload so a branch or SHA can never break out of the
          # JSON, and --input - keeps it off the command line.
          jq -nc \
            --arg event_type "$EVENT_TYPE" \
            --arg sha "$SOURCE_SHA" \
            --arg branch "$SOURCE_BRANCH" \
            '{event_type: $event_type, client_payload: {sha: $sha, branch: $branch}}' \
          | gh api "repos/$TARGET_REPOSITORY/dispatches" --input -
          # Recorded because the dispatch itself cannot fail informatively: what
          # was sent, and to whom, is the only evidence when the target stays
          # still after a green run here.
          echo "Sent \`$EVENT_TYPE\` to \`$TARGET_REPOSITORY\` for \`$SOURCE_BRANCH\` at \`${SOURCE_SHA:0:8}\`" \
            >> "$GITHUB_STEP_SUMMARY"

      # The dispatch is a trigger, not an instruction: the receiving workflow
      # re-resolves this repository's master itself and ignores the payload SHA.
      # A later dispatch or manual run converges the target to the current branch
      # head, so retrying an individual dispatch is unnecessary for eventual
      # correctness. If no later event occurs, however, a lost dispatch can leave
      # the target stale, so the two steps below make a failure visible and mark
      # it recovered once a run gets through.
      #
      # Both steps share DEDUP_KEY: consecutive failures fold into the one open
      # incident instead of paging per push, and the next success resolves it.

      - name: Trigger PagerDuty incident
        if: failure()
        continue-on-error: true
        env:
          PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
          DEDUP_KEY: deploy-dispatch-${{ github.repository }}
          TARGET_REPOSITORY: ${{ vars.DEPLOY_DISPATCH_REPOSITORY }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The secrets context is unavailable in step-level `if`, so an unset key
          # is handled here to keep alerting optional rather than required.
          if [[ -z "${PAGERDUTY_ROUTING_KEY:-}" ]]; then
            echo "PAGERDUTY_ROUTING_KEY is not set; skipping the PagerDuty alert."
            exit 0
          fi
          # jq builds the payload so a branch name cannot break out of the JSON,
          # and --data-binary @- keeps the routing key off the command line.
          jq -nc \
            --arg routing_key "$PAGERDUTY_ROUTING_KEY" \
            --arg dedup_key "$DEDUP_KEY" \
            --arg target "$TARGET_REPOSITORY" \
            --arg branch "$SOURCE_BRANCH" \
            --arg sha "${SOURCE_SHA:0:8}" \
            --arg run_url "$RUN_URL" \
            '{routing_key: $routing_key,
              event_action: "trigger",
              dedup_key: $dedup_key,
              payload: {
                summary: "Failed to notify \($target) of \($branch) at \($sha); its deploy pin may be stale",
                source: "github-actions",
                component: "deploy-dispatch",
                # severity maps to urgency in PagerDuty. A stale pin self-heals on
                # the next push, so it warrants attention, not an immediate page.
                severity: "warning",
                custom_details: {target: $target, branch: $branch, sha: $sha}},
              links: [{href: $run_url, text: "View workflow run"}]}' \
          | curl -sSf --retry 3 --retry-connrefused -X POST \
              -H 'Content-Type: application/json' \
              --data-binary @- https://events.pagerduty.com/v2/enqueue

      - name: Resolve PagerDuty incident
        if: success()
        continue-on-error: true
        env:
          PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
          DEDUP_KEY: deploy-dispatch-${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "${PAGERDUTY_ROUTING_KEY:-}" ]]; then
            echo "PAGERDUTY_ROUTING_KEY is not set; skipping the PagerDuty resolve."
            exit 0
          fi
          # Resolving a dedup key with no open incident is accepted and does
          # nothing, so this runs unconditionally on success.
          jq -nc \
            --arg routing_key "$PAGERDUTY_ROUTING_KEY" \
            --arg dedup_key "$DEDUP_KEY" \
            '{routing_key: $routing_key, event_action: "resolve", dedup_key: $dedup_key}' \
          | curl -sSf --retry 3 --retry-connrefused -X POST \
              -H 'Content-Type: application/json' \
              --data-binary @- https://events.pagerduty.com/v2/enqueue
